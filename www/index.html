<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LTW-Turbo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="page-title">首页</header>
  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-settings"></section>
    <section class="view" id="view-info"></section>
  </main>
  <nav>
    <button class="tab active" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-6v-6h-4v6H4z"/></svg>首页</button>
    <button class="tab" data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M15 4v6M4 17h3M11 17h9M9 14v6"/></svg>设置</button>
    <button class="tab" data-view="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>信息</button>
  </nav>
</div>
<div id="overlay" hidden><div id="menu"></div></div>
<div id="modal" hidden>
  <div id="dialog">
    <h3 id="dialog-title"></h3>
    <p id="dialog-text"></p>
    <div id="dialog-actions">
      <button id="dialog-cancel">取消</button>
      <button id="dialog-ok"></button>
    </div>
  </div>
</div>

<div id="export-modal" hidden>
  <div class="sheet">
    <h3>导出配置</h3>
    <canvas id="export-qr" width="200" height="200"></canvas>
    <textarea id="export-json" readonly spellcheck="false"></textarea>
    <div class="sheet-actions">
      <button id="export-copy">复制</button>
      <button id="export-download">下载</button>
      <button id="export-share">分享</button>
      <button id="export-close">关闭</button>
    </div>
  </div>
</div>

<div id="import-modal" hidden>
  <div class="sheet">
    <h3>导入配置</h3>
    <div class="import-methods">
      <button id="import-scan">摄像头扫码</button>
      <button id="import-paste">粘贴 JSON</button>
      <button id="import-file">选择文件</button>
    </div>
    <textarea id="import-json" placeholder="在此粘贴 JSON 配置…" spellcheck="false" hidden></textarea>
    <input type="file" id="import-file-input" accept=".json,application/json,text/plain" hidden>
    <p id="import-result" class="result" hidden></p>
    <div class="sheet-actions">
      <button id="import-do" hidden>导入</button>
      <button id="import-close">关闭</button>
    </div>
  </div>
</div>

<div id="scan-modal" hidden>
  <div class="sheet">
    <h3>扫描二维码</h3>
    <video id="scan-video" autoplay playsinline muted></video>
    <canvas id="scan-canvas" hidden></canvas>
    <input type="file" id="scan-file-input" accept="image/*" hidden>
    <p id="scan-error" class="result error" hidden></p>
    <div class="sheet-actions">
      <button id="scan-file">选择图片识别</button>
      <button id="scan-close">关闭</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
