<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LTW-Turbo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="page-title">首页</header>
  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-settings"></section>
    <section class="view" id="view-info"></section>
  </main>
  <nav>
    <button class="tab active" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-6v-6h-4v6H4z"/></svg>首页</button>
    <button class="tab" data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M15 4v6M4 17h3M11 17h9M9 14v6"/></svg>设置</button>
    <button class="tab" data-view="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>信息</button>
  </nav>
</div>
<div id="overlay" hidden><div id="menu"></div></div>
<div id="modal" hidden>
  <div id="dialog">
    <h3 id="dialog-title"></h3>
    <p id="dialog-text"></p>
    <div id="dialog-actions">
      <button id="dialog-cancel">取消</button>
      <button id="dialog-ok"></button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
