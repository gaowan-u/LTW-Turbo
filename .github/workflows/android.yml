name: Android CI - Build AAR

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ltw/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Android NDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/ndk
          ~/.gradle/ndk
        key: ${{ runner.os }}-ndk-${{ hashFiles('ltw/build.gradle') }}

    - name: Build with Gradle
      run: ./gradlew :ltw:assembleDebug --parallel --build-cache --configuration-cache

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
         name: output-aar
         path: ltw/build/outputs/aar/ltw-debug.aar
         if-no-files-found: error
       
