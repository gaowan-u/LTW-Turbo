name: Android Build - Build APK

on:
  push:
    branches: [ main, master, ui/optimize-app-interface ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Android NDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/ndk
          ~/.gradle/ndk
        key: ${{ runner.os }}-ndk-${{ hashFiles('ltw/build.gradle') }}

    - name: Sync Capacitor
      run: npx cap sync

    - name: Prepare signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ltw-key.jks"
        fi

    - name: Build Android APK
      env:
        KEYSTORE_FILE: ${{ runner.temp }}/ltw-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd capacitor-android
        ./gradlew assembleDebug --parallel --build-cache --configuration-cache

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: capacitor-android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
